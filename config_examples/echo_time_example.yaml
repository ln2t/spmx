# spmx: EchoTime Configuration Example
# This config demonstrates how to specify EchoTime for DCM processing

matlab_path: /opt/matlab/R2023b/bin/matlab
spm_path: /opt/spm12

fmri:
  voi:
    radius: 8
    seeds:
      - name: "V1"
        x: 0
        y: -90
        z: 0
      - name: "V5"
        x: -45
        y: -65
        z: 0

  dcm:
    # IMPORTANT: EchoTime specifies the echo time (in seconds) used in the fMRI acquisition
    # This parameter is crucial for accurate DCM model estimation
    # 
    # Priority for EchoTime:
    # 1. First, the pipeline looks in the SPM.mat JSON sidecar (from first-level --fit processing)
    # 2. If not found there, it uses the value specified below
    # 3. If not found anywhere, it defaults to 0.04 (with a warning)
    #
    # Get this value from your acquisition protocol or fMRI JSON sidecar
    EchoTime: 0.031  # Example: 31ms echo time (adjust to your acquisition)
    
    default_delay: 1.5
    
    delays:
      V1: 1.3
      V5: 1.5
    
    models:
      - name: "hierarchical"
        A: [[0, 0],
            [1, 0]]
        B: [[0, 0],
            [0, 0]]
        C: [1, 0]
